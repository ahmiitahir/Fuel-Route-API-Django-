<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel Route Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5b6672; --line:#dfe3e8; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --card:#1e2227; --ink:#e8ebee; --muted:#9aa5b1; --line:#323941; --accent:#58a6ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink);
         display:grid; grid-template-columns:380px 1fr; height:100vh; }
  aside { padding:16px; overflow:auto; background:var(--card); border-right:1px solid var(--line); }
  h1 { font-size:18px; margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
          background:var(--bg); color:var(--ink); font:inherit; }
  button { margin-top:12px; width:100%; padding:9px; border:0; border-radius:6px; background:var(--accent);
           color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #map { height:100%; min-height:300px; }
  .summary { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .stat b { display:block; font-size:18px; }
  .stat span { color:var(--muted); font-size:12px; }
  .stop { border-top:1px solid var(--line); padding:10px 0; }
  .stop h3 { margin:0; font-size:14px; }
  .stop small { color:var(--muted); display:block; }
  .err { color:#c0392b; margin-top:10px; }
  .num { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%;
         background:var(--accent); color:#fff; font-size:12px; margin-right:6px; }
  .pin { width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; border:2px solid #fff;
         display:grid; place-items:center; font-weight:700; font-size:13px; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .pin.end { background:#2da44e; } .pin.begin { background:#8250df; }
  @media (max-width: 760px) { body { grid-template-columns:1fr; grid-template-rows:auto 60vh; height:auto; } }
</style>
</head>
<body>
<aside>
  <h1>Fuel Route Planner</h1>
  <form id="form">
    <label for="start">Start (City, ST or lat,lon)</label>
    <input id="start" name="start" value="{{ start }}" placeholder="Los Angeles, CA" required>
    <label for="finish">Finish</label>
    <input id="finish" name="finish" value="{{ finish }}" placeholder="New York, NY" required>
    <button id="go" type="submit">Plan route</button>
  </form>
  <div id="error" class="err" hidden></div>
  <div id="result" hidden>
    <div class="summary">
      <div class="stat"><b id="s-cost"></b><span>total fuel cost</span></div>
      <div class="stat"><b id="s-dist"></b><span>miles</span></div>
      <div class="stat"><b id="s-gal"></b><span>gallons (10 mpg)</span></div>
      <div class="stat"><b id="s-stops"></b><span>fuel stops</span></div>
    </div>
    <div id="start-fuel"></div>
    <div id="stops"></div>
    <p><a id="json-link" href="#" target="_blank" rel="noopener">View raw JSON</a></p>
  </div>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const API_URL = "{{ api_url }}";
const map = L.map("map").setView([39.5, -98.35], 4);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);
const layer = L.layerGroup().addTo(map);

const $ = id => document.getElementById(id);
const money = n => "$" + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pin = (txt, cls) => L.divIcon({className: "", html: `<div class="pin ${cls||""}">${txt}</div>`, iconSize: [26, 26], iconAnchor: [13, 13]});

async function plan(start, finish) {
  $("error").hidden = true; $("result").hidden = true; $("go").disabled = true; $("go").textContent = "Planning…";
  try {
    const qs = new URLSearchParams({start, finish});
    const res = await fetch(`${API_URL}?${qs}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || data.detail || JSON.stringify(data));
    render(data, `${API_URL}?${qs}`);
  } catch (e) {
    $("error").textContent = e.message; $("error").hidden = false;
  } finally { $("go").disabled = false; $("go").textContent = "Plan route"; }
}

function render(d, jsonUrl) {
  layer.clearLayers();
  const line = L.geoJSON(d.route, {style: {color: "#1f6feb", weight: 5, opacity: .85}}).addTo(layer);
  L.marker([d.start.lat, d.start.lon], {icon: pin("A", "begin")}).bindPopup(`<b>Start</b><br>${esc(d.start.label)}`).addTo(layer);
  L.marker([d.finish.lat, d.finish.lon], {icon: pin("B", "end")}).bindPopup(`<b>Finish</b><br>${esc(d.finish.label)}`).addTo(layer);
  d.fuel_stops.forEach(s => {
    L.marker([s.lat, s.lon], {icon: pin(s.order)}).bindPopup(
      `<b>${esc(s.name)}</b><br>${esc(s.city)}, ${esc(s.state)}<br>${esc(s.address)}<br>` +
      `<b>${money(s.price_per_gallon)}/gal</b> × ${s.gallons_purchased} gal = <b>${money(s.cost)}</b>`).addTo(layer);
  });
  map.fitBounds(line.getBounds(), {padding: [30, 30]});

  $("s-cost").textContent = money(d.total_fuel_cost);
  $("s-dist").textContent = d.distance_miles.toLocaleString();
  $("s-gal").textContent = d.total_gallons.toLocaleString();
  $("s-stops").textContent = d.fuel_stops.length;
  $("start-fuel").innerHTML = d.starting_fuel
    ? `<div class="stop"><h3>Start: ${esc(d.start.label)}</h3><small>${d.starting_fuel.gallons} gal @ ${money(d.starting_fuel.price_per_gallon)} = ${money(d.starting_fuel.cost)}</small></div>` : "";
  $("stops").innerHTML = d.fuel_stops.map(s =>
    `<div class="stop"><h3><span class="num">${s.order}</span>${esc(s.name)}</h3>
     <small>${esc(s.city)}, ${esc(s.state)} · mile ${s.mile_marker}</small>
     <small>${s.gallons_purchased} gal @ ${money(s.price_per_gallon)} = <b>${money(s.cost)}</b></small></div>`).join("");
  $("json-link").href = jsonUrl;
  $("result").hidden = false;
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const start = $("start").value.trim(), finish = $("finish").value.trim();
  history.replaceState(null, "", "?" + new URLSearchParams({start, finish}));
  plan(start, finish);
});
if ($("start").value && $("finish").value) plan($("start").value, $("finish").value);
</script>
</body>
</html>
